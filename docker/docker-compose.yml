# 鐎圭懓娅掗弮銉ョ箶鏉烆喛娴?json-file):闂勬劕鍩楃壕浣烘磸閸楃姷鏁?闁灝鍘ら梹鎸庢埂鏉╂劘顢戦弮銉ョ箶閺冪娀妾烘晶鐐烘毐
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-app
    ports:
      - "8080:80"
    environment:
      # deepagents agent-service 閸︽澘娼?prod 鐠?compose 閺堝秴濮熼崥?閺堫剚婧€鐠嬪啳鐦崣顖涘瘹閸?http://localhost:8000
      DEEPAGENTS_BASE_URL: "${DEEPAGENTS_BASE_URL:-http://agent-service:8000}"
      # --- 濞屾瑧顔堥崷鏉挎絻濡€崇础:k8s(NodePort 缂?kind 閼哄倻鍋ｉ惄纾嬬箾)/ dns(compose 鐎圭懓娅掗崥宥囨纯鏉? ---
      APP_SANDBOX_ADDR_MODE: "${APP_SANDBOX_ADDR_MODE:-nodeport}"
      APP_SANDBOX_NODE_HOST: "${APP_SANDBOX_NODE_HOST:-172.21.0.200}"
      APP_SANDBOX_NODEPORT_BASE: "${APP_SANDBOX_NODEPORT_BASE:-30000}"
      # --- 閻劍鍩涘銉ょ稊閸?/ uid 闂呮梻顬?---
      WORKSPACE_ROOT: "${WORKSPACE_ROOT:-/workspace}"
      WORKSPACE_PER_USER_DATA_ROOT: "${WORKSPACE_PER_USER_DATA_ROOT:-/data/users}"
      WORKSPACE_UID_BASE: "${WORKSPACE_UID_BASE:-100000}"
      # --- 鐎规碍妞傛禒璇插(job 閻?agent-service SSE 閹笛嗩攽,閺冪姴顔愰崳? ---
      AGENT_JOBS_MAX_CONCURRENT: "${AGENT_JOBS_MAX_CONCURRENT:-1}"
      AGENT_JOBS_TIMEOUT_MINUTES: "${AGENT_JOBS_TIMEOUT_MINUTES:-30}"
      AGENT_JOBS_SWEEP_MS: "${AGENT_JOBS_SWEEP_MS:-5000}"
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_TTL_MINUTES: "1440"
      # --- 濞夈劌鍞藉鈧崗?閻㈢喍楠囨妯款吇閸?闂冨弶澹掗柌蹇斾簰閻?闂団偓鐟曚礁绱戦弨鐐鐠?true) ---
      APP_REGISTRATION_ENABLED: "${APP_REGISTRATION_ENABLED:-false}"
      # --- AES 閸旂姴鐦戠€靛棝鎸?Base64 缂傛牜鐖?32 鐎涙濡?;閻㈢喍楠囬崝鈥崇箑閺囨寧宕叉稉娲閺堝搫鐦戦柦?---
      APP_AES_KEY: ${APP_AES_KEY:?set in .env}
      # --- agent-service 閸愬懘鍎撮崶鐐剁殶娴犮倗澧?create_skill 閸ョ偛鍟撻幎鈧懗钘夌氨;娑撱倖婀囬崝鈥茬閼? ---
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set to a random secret in .env, shared with agent-service}
      # --- MySQL(閺佺増宓佸┃?compose 閸愬懘鍎?mysql 閺堝秴濮?缂佸繑婀囬崝鈥虫倳鐠佸潡妫? ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: aiworkbench
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set in .env}
      # 濞村繗顫嶉崳銊╂桨閺夊潡鎽肩捄顖涘笓閺屻儳鏁?DEBUG(缁嬪啿鐣鹃崥搴″讲閸?
      LOGGING_LEVEL_COM_AIWORKBENCH_CONTROLLER: "${LOGGING_LEVEL_APP:-INFO}"
      LOGGING_LEVEL_COM_AIWORKBENCH_SERVICE_OPENCODE: "${LOGGING_LEVEL_APP:-INFO}"
    volumes:
      - workspace:/workspace
      - app-data:/data
      - user-data:/data/users
      # 缂冩垵鍙ч幐澶愭付閸掓稑缂?閸ョ偞鏁瑰В蹇曟暏閹撮攱绁荤憴鍫濇珤鐎圭懓娅?婢跺秶鏁ら弮?opencode 鐎圭偞鏌﹂弬瑙勵攳;闁倻鏁ら崡鏇熸簚缁狅紕鎮婇崨姗€鍎寸純?
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - agents
    # 閺佺増宓佸┃鎰礋 compose 閸愬懘鍎?mysql 閺堝秴濮?mysql 閺堝秴濮熼崥?,缁涘绶熼崗璺烘皑缂侇亜鎮楅崥顖氬З
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # --- deepagents 鏉炪劑浜?python agent-service(濮ｅ繒鏁ら幋椋庡缁斿浼愭担婊冨隘/閹垛偓閼?+ 閸欘垱澧界悰宀冨壖閺? ---
  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-agent-service
    ports:
      # 娴犲懐绮﹂崶鐐靛箚:鐎瑰じ瀵岀粩顖氬經娓氭稒婀伴張?Spring(dev)/鐠嬪啳鐦惄纾嬬箾;鐎圭懓娅掔純鎴濆敶鐠х増婀囬崝鈥虫倳 agent-service:8000閵?
      # 娑撳秷顩﹂弳鎾苟閸?0.0.0.0 閳ユ柡鈧?agent-service 閺冪姾鍤滈煬顐﹀閺?user_id 閸楀疇闊╂禒濮愨偓?
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8000}:8000"
    environment:
      AGENT_MODEL: "${AGENT_MODEL:?set in .env}"
      AGENT_MODEL_BASE_URL: "${AGENT_MODEL_BASE_URL:-}"
      AGENT_MODEL_API_KEY: "${AGENT_MODEL_API_KEY:-}"
      # 楠炶泛褰傞崝鐘叉祼:婢?worker + PG checkpoint 鏉╃偞甯村Ч?
      AGENT_WORKERS: "${AGENT_WORKERS:-4}"
      AGENT_PG_POOL_MIN: "${AGENT_PG_POOL_MIN:-2}"
      AGENT_PG_POOL_MAX: "${AGENT_PG_POOL_MAX:-10}"
      AGENT_WS_ROOT: /shared-ws/users
      AGENT_PG_DSN: "postgresql://aiworkbench:${POSTGRES_PASSWORD:-aiworkbench-pass}@postgres:5432/agent_workbench"
      AGENT_HITL: "${AGENT_HITL:-true}"
      # 楠炲啿褰寸痪褍鍞寸純顔藉Η閼崇晫娲拌ぐ?闂€婊冨剼閸?/app/skills 閸?browser-operate 缁?
      AGENT_GLOBAL_SKILLS: /app/skills
      # create_skill 瀹搞儱鍙块崶鐐插晸閸氬海顏幎鈧懗钘夌氨(閸愬懘鍎撮幒銉ュ經 + 閸忓彉闊╂禒銈囧)
      BACKEND_INTERNAL_URL: "http://app:8080"
      # --- agent-service 閸愬懘鍎撮崶鐐剁殶娴犮倗澧?create_skill 閸ョ偛鍟撻幎鈧懗钘夌氨;娑撱倖婀囬崝鈥崇箑妞よ绔撮懛缈犵瑬娑撴椽娈㈤張鍝勨偓? ---
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set to a random secret in .env, shared with app}
      # 閹笛嗩攽濞屾瑧顔?execute 娑?/workspace 瀹搞儱鍙块崷?per-user 鐎圭懓娅掗崘鍛扮獓(docker|local|k8s);
      # 濞屾瑧顔堥崥灞炬閹佃儻娴囬崗鍙橀煩濞村繗顫嶉崳?CDP/playwright-mcp)閵嗗倹璐╅崥鍫熺仸閺?k8s = 濞屾瑧顔?Pod 閸?kind 闂嗗棛鍏?
      # executor 缂?<node>:<nodePort> 閻╃绻?瀹搞儰缍旈崠楦胯泲閼哄倻鍋?extraMounts 閻╁瓨瀵?docker_workspace 閸楁灚鈧?
      AGENT_SANDBOX_BACKEND: "${AGENT_SANDBOX_BACKEND:-k8s}"
      AGENT_SANDBOX_IMAGE: "${AGENT_SANDBOX_IMAGE:-kind-registry:5000/aiwb-sandbox:1}"
      AGENT_SANDBOX_NETWORK: "${AGENT_SANDBOX_NETWORK:-true}"
      AGENT_SANDBOX_NETWORK_NAME: "${AGENT_SANDBOX_NETWORK_NAME:-aiwb-agents}"
      # daemon 鐟欏棜顫楅惃?workspace 閸楅攱鏆熼幑顔界壌(閸楀嘲鎮?= <compose妞ゅ湱娲伴崥?_workspace)
      AGENT_SANDBOX_VOLUME_ROOT: "${AGENT_SANDBOX_VOLUME_ROOT:-/var/lib/docker/volumes/docker_workspace/_data/users}"
      AGENT_SANDBOX_UID: "${AGENT_SANDBOX_UID:-10001}"
      AGENT_SANDBOX_MEM_MB: "${AGENT_SANDBOX_MEM_MB:-2048}"
      AGENT_SANDBOX_CPUS: "${AGENT_SANDBOX_CPUS:-1.0}"
      AGENT_SANDBOX_PIDS: "${AGENT_SANDBOX_PIDS:-256}"
      AGENT_SANDBOX_IDLE_TTL: "${AGENT_SANDBOX_IDLE_TTL:-1800}"
      AGENT_SANDBOX_MAX_TIMEOUT: "${AGENT_SANDBOX_MAX_TIMEOUT:-120}"
      # --- k8s 濞ｅ嘲鎮庨弸鑸电€▽娆戭唸(kind 闂嗗棛鍏? ---
      AGENT_K8S_NAMESPACE: "${AGENT_K8S_NAMESPACE:-ai-workbench}"
      # hostpath = 濞屾瑧顔?Pod 閹?kind 閼哄倻鍋?extraMounts 閻?compose 閸楅娲拌ぐ?閺堫剚婧€姒涙顓?;
      # pvc = 闂嗗棛鍏㈤崘?PVC 鐎涙ê鍋?
      AGENT_K8S_SANDBOX_VOLUME_TYPE: "${AGENT_K8S_SANDBOX_VOLUME_TYPE:-hostpath}"
      AGENT_K8S_SANDBOX_VOLUME_HOST_PATH: "${AGENT_K8S_SANDBOX_VOLUME_HOST_PATH:-/mnt/compose-workspace}"
      # kind 閼哄倻鍋ｉ崷?aiwb-agents 濡椼儳缍夐惃鍕瀻閸?IP(瀹?docker network connect --ip 閸ュ搫鐣?IP 閻╃绻涚紒鏇炵磻 Chromium Host 閺嶏繝鐛?
      AGENT_K8S_SANDBOX_NODE_ADDR: "${AGENT_K8S_SANDBOX_NODE_ADDR:-172.21.0.200}"
      AGENT_K8S_SANDBOX_NODEPORT: "${AGENT_K8S_SANDBOX_NODEPORT:-true}"
      AGENT_K8S_SANDBOX_NODEPORT_BASE: "${AGENT_K8S_SANDBOX_NODEPORT_BASE:-30000}"
      # kubeconfig 闁?apiserver 閺勵垰顔栨稉鏄忣潒鐟?127.0.0.1:port,鐎圭懓娅掗崘鍛床閹?host.docker.internal
      AGENT_K8S_API_HOST: "host.docker.internal:60176"
      KUBECONFIG: /kube/config
    volumes:
      - user-data:/data/users
      # 工作区:默认命名卷;Linux 生产用 docker-compose.prod.yml 切换为 bind mount
      - workspace:/shared-ws
      # 濞屾瑧顔堢€圭懓娅掗悽鐔锋嚒閸涖劍婀＄粻锛勬倞(per-user 鐎圭懓娅掗悽?agent-service 閸掓稑缂?docker 閸氬海顏幍宥夋付鐟?
      - /var/run/docker.sock:/var/run/docker.sock
      # kind 闂嗗棛鍏?kubeconfig(agent-service 缂佸繑顒濈粻锛勬倞濞屾瑧顔?Pod/NodePort Service)
      - ../k8s/scripts/kind-kubeconfig.yaml:/kube/config:ro
    # 鏉╂劘顢戦張鐔峰閸?agent-service 闂団偓 root(鐎靛湱鏁ら幋宄颁紣娴ｆ粌灏?chown 閸掔増鐭欑粻?uid)楠炴儼顔栭梻?docker.sock
    # (閸掓稑缂?閸ョ偞鏁瑰▽娆戭唸鐎圭懓娅?;no-new-privileges 闂冨弶顒涢幓鎰綀閺€鎯с亣,闂勫秳缍嗙悮顐ｆ暰閻潙鎮楅惃鍕閸濆秴宕愬鍕┾偓?
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - agents
    logging: *default-logging
    restart: unless-stopped

  # 濞屾瑧顔堥梹婊冨剼閺嬪嫬缂撴潪鎴掔秼(execute + 閸忓彉闊╁ù蹇氼潔閸ｃ劌鎮庨獮鍫曟殔閸?;娴犲懐鏁ゆ禍?docker compose build 娴溠冨毉,
  # up 閺冨墎鐝涢崡鎶解偓鈧崙?restart:no)閵嗕竣ontext 閸欐牔绮ㄦ惔鎾寸壌娴犮儰绌?COPY 娑擃厽鏋冪€涙ぞ缍?濞村繗顫嶉崳銊ュ弳閸欙絻鈧?
  agent-sandbox-image:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile.sandbox
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-sandbox
    restart: "no"
    command: ["true"]

  # deepagents 閹镐椒绠欓崠?缁捐法鈻?checkpoint + 鐠恒劎鍤庣粙?store
  postgres:
    image: docker.m.daocloud.io/postgres:16-alpine
    environment:
      POSTGRES_USER: aiworkbench
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aiworkbench-pass}"
      POSTGRES_DB: agent_workbench
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkbench -d agent_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  # 鐎圭懓娅掗崠?MySQL(2026-08-23 閸氼垳鏁?:Windows 鐎瑰じ瀵岄張鍝勫煂鐎圭懓娅掗惃鍕崲閹板繒顏崣锝夆偓姘崇熅娑撳秶菙鐎?
  # (host.docker.internal 閸欘亙绻氱拠浣稿嚒閸欐垵绔风粩顖氬經),閺佺増宓佹惔鎾冲弳 compose 閸氬簼绗夐崘宥勭贩鐠ф牞顕氭潏鍦櫕閵?
  # 鐎瑰じ瀵岄張?MySQL(127.0.0.1)娣囨繄鏆€娑撶儤鏆熼幑顔界爱婢跺洣鍞?閺堫亜浠涙禒璁崇秿閺€鐟板З閵?
  mysql:
    image: docker.m.daocloud.io/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ai_workbench
      MYSQL_USER: aiworkbench
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

volumes:
  workspace:
  app-data:
  mysql-data:
  user-data:
  postgres-data:

networks:
  # 缂冩垵鍙ф稉搴㈢槨閻劍鍩涘ù蹇氼潔閸ｃ劌顔愰崳銊ュ彙閻劎缍夌紒?缂冩垵鍙ч幐澶婎啇閸ｃ劌鎮?DNS 閻╃绻?CDP/MCP)
  agents:
    name: aiwb-agents
