services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        OPENCODE_VERSION: "1.18.16"
        # 内网部署:把下面注释打开,指向内部 opencode 二进制镜像
        # OPENCODE_DOWNLOAD_URL: "http://internal-mirror/opencode-linux-x64-baseline.tar.gz"
    # 固定镜像 tag:每用户 agent 容器复用本镜像(容器模式)
    image: ai-workbench-app
    ports:
      - "8080:80"
    environment:
      # --- 对话后端引擎:opencode | deepagents(deepagents 轨道不消耗 opencode 进程/容器) ---
      AGENT_BACKEND: "${AGENT_BACKEND:-opencode}"
      # deepagents agent-service 地址:prod 走 compose 服务名;本机调试可指向 http://localhost:8000
      DEEPAGENTS_BASE_URL: "${DEEPAGENTS_BASE_URL:-http://agent-service:8000}"
      # --- opencode 内部认证(网关 -> opencode) ---
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set in .env}
      # --- Phase 3 每用户 agent 容器隔离(容器模式) ---
      OPENCODE_CONTAINER_MODE: "${OPENCODE_CONTAINER_MODE:-true}"
      AGENT_IMAGE: "${AGENT_IMAGE:-ai-workbench-agent}"
      OPENCODE_IDLE_TIMEOUT: "${OPENCODE_IDLE_TIMEOUT:-900}"
      OPENCODE_AGENT_CPUS: "${OPENCODE_AGENT_CPUS:-1}"
      OPENCODE_AGENT_MEMORY_MB: "${OPENCODE_AGENT_MEMORY_MB:-2048}"
      OPENCODE_AGENT_STOP_GRACE: "${OPENCODE_AGENT_STOP_GRACE:-5}"
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_TTL_MINUTES: "1440"
      # --- 注册开关(生产默认关,防批量滥用;需要开放时设 true) ---
      APP_REGISTRATION_ENABLED: "${APP_REGISTRATION_ENABLED:-false}"
      # --- AES 加密密钥(Base64 编码 32 字节);生产务必替换为随机密钥 ---
      APP_AES_KEY: ${APP_AES_KEY:?set in .env}
      # --- MySQL(本机服务,非容器) ---
      # 本机 MySQL 局域网 IP;app 在容器内不能用 localhost,须用宿主可达 IP
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-192.168.0.161}:3306/ai_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: aiworkbench
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set in .env}
      # --- 工作区 ---
      OPENWORK_WORKSPACE: /workspace
    volumes:
      - workspace:/workspace
      - app-data:/data
      # Phase 3:网关经宿主 docker 守护进程创建/回收每用户 agent 容器。
      # 安全注意:该挂载使 app 容器拥有宿主机 docker 完全控制权,仅适用于单机管理员部署。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - agents
    restart: unless-stopped

  # 仅构建 agent 专用精简镜像(容器模式每用户 agent 容器用);profile=build 不随默认 up 启动,
  # 部署时用 `docker compose --profile build build agent-build` 单独构建。
  agent-build:
    profiles: ["build"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent-runtime
      args:
        OPENCODE_VERSION: "1.18.16"
    image: ai-workbench-agent
    restart: "no"
    command: ["true"]

  # --- deepagents 轨道:python agent-service(每用户独立工作区/技能 + 可执行脚本) ---
  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-agent-service
    ports:
      # 宿主端口供本机运行的 Spring(dev)直连;prod 网关容器内经服务名 agent-service:8000 访问
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    environment:
      AGENT_MODEL: "${AGENT_MODEL:?set in .env}"
      AGENT_MODEL_BASE_URL: "${AGENT_MODEL_BASE_URL:-}"
      AGENT_MODEL_API_KEY: "${AGENT_MODEL_API_KEY:-}"
      # 并发加固:多 worker + PG checkpoint 连接池
      AGENT_WORKERS: "${AGENT_WORKERS:-4}"
      AGENT_PG_POOL_MIN: "${AGENT_PG_POOL_MIN:-2}"
      AGENT_PG_POOL_MAX: "${AGENT_PG_POOL_MAX:-10}"
      AGENT_WS_ROOT: /shared-ws/users
      AGENT_PG_DSN: "postgresql://aiworkbench:${POSTGRES_PASSWORD:-aiworkbench-pass}@postgres:5432/agent_workbench"
      AGENT_HITL: "${AGENT_HITL:-false}"
    volumes:
      - user-data:/data/users
      # 与 app 共用 workspace 卷:agent 写 /shared-ws/users/<uid>/project
      # == app 前端文件树 /workspace/users/<uid>/project,保证 UI 可见。
      - workspace:/shared-ws
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # deepagents 持久化:线程 checkpoint + 跨线程 store
  postgres:
    image: docker.m.daocloud.io/postgres:16-alpine
    environment:
      POSTGRES_USER: aiworkbench
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aiworkbench-pass}"
      POSTGRES_DB: agent_workbench
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkbench -d agent_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 本机 MySQL 服务已接入后不再使用容器 MySQL;保留定义便于回退。
  # 需要重新启用时:去掉下面 profiles 行,并恢复 app 的 depends_on。
  mysql:
    profiles: ["legacy-mysql"]
    image: docker.m.daocloud.io/mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ai_workbench
      MYSQL_USER: aiworkbench
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  workspace:
  app-data:
  mysql-data:
  user-data:
  postgres-data:

networks:
  # 每用户 agent 容器专用网络(app 容器亦接入):网关经容器名 DNS 直连各 agent 的 opencode serve
  agents:
    name: aiwb-agents
