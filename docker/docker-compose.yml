# 容器日志轮转(json-file):限制磁盘占用,避免长期运行日志无限增长
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-app
    ports:
      - "8080:80"
    environment:
      # deepagents agent-service 地址:prod 走 compose 服务名;本机调试可指向 http://localhost:8000
      DEEPAGENTS_BASE_URL: "${DEEPAGENTS_BASE_URL:-http://agent-service:8000}"
      # --- 用户工作区 / uid 隔离 ---
      WORKSPACE_ROOT: "${WORKSPACE_ROOT:-/workspace}"
      WORKSPACE_PER_USER_DATA_ROOT: "${WORKSPACE_PER_USER_DATA_ROOT:-/data/users}"
      WORKSPACE_UID_BASE: "${WORKSPACE_UID_BASE:-100000}"
      # --- 定时任务(job 由 agent-service SSE 执行,无容器) ---
      AGENT_JOBS_MAX_CONCURRENT: "${AGENT_JOBS_MAX_CONCURRENT:-1}"
      AGENT_JOBS_TIMEOUT_MINUTES: "${AGENT_JOBS_TIMEOUT_MINUTES:-30}"
      AGENT_JOBS_SWEEP_MS: "${AGENT_JOBS_SWEEP_MS:-5000}"
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_TTL_MINUTES: "1440"
      # --- 注册开关(生产默认关,防批量滥用;需要开放时设 true) ---
      APP_REGISTRATION_ENABLED: "${APP_REGISTRATION_ENABLED:-false}"
      # --- AES 加密密钥(Base64 编码 32 字节);生产务必替换为随机密钥 ---
      APP_AES_KEY: ${APP_AES_KEY:?set in .env}
      # --- agent-service 内部回调令牌(create_skill 回写技能库;两服务一致) ---
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set to a random secret in .env, shared with agent-service}
      # --- MySQL(数据源:宿主机 MySQL,经 host.docker.internal 访问;见 .env 的 MYSQL_HOST) ---
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-host.docker.internal}:3306/ai_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: aiworkbench
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set in .env}
      # 浏览器面板链路排查用 DEBUG(稳定后可删)
      LOGGING_LEVEL_COM_AIWORKBENCH_CONTROLLER: "${LOGGING_LEVEL_APP:-INFO}"
      LOGGING_LEVEL_COM_AIWORKBENCH_SERVICE_OPENCODE: "${LOGGING_LEVEL_APP:-INFO}"
    volumes:
      - workspace:/workspace
      - app-data:/data
      - user-data:/data/users
      # 网关按需创建/回收每用户浏览器容器(复用旧 opencode 实施方案;适用单机管理员部署)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - agents
    # 数据源为宿主机 MySQL(host.docker.internal),不再依赖 compose 内 mysql 服务
    logging: *default-logging
    restart: unless-stopped

  # --- deepagents 轨道:python agent-service(每用户独立工作区/技能 + 可执行脚本) ---
  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.m.daocloud.io}"
    image: ai-workbench-agent-service
    ports:
      # 仅绑回环:宿主端口供本机 Spring(dev)/调试直连;容器网内走服务名 agent-service:8000。
      # 不要暴露到 0.0.0.0 —— agent-service 无自身鉴权,user_id 即身份。
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8000}:8000"
    environment:
      AGENT_MODEL: "${AGENT_MODEL:?set in .env}"
      AGENT_MODEL_BASE_URL: "${AGENT_MODEL_BASE_URL:-}"
      AGENT_MODEL_API_KEY: "${AGENT_MODEL_API_KEY:-}"
      # 并发加固:多 worker + PG checkpoint 连接池
      AGENT_WORKERS: "${AGENT_WORKERS:-4}"
      AGENT_PG_POOL_MIN: "${AGENT_PG_POOL_MIN:-2}"
      AGENT_PG_POOL_MAX: "${AGENT_PG_POOL_MAX:-10}"
      AGENT_WS_ROOT: /shared-ws/users
      AGENT_PG_DSN: "postgresql://aiworkbench:${POSTGRES_PASSWORD:-aiworkbench-pass}@postgres:5432/agent_workbench"
      AGENT_HITL: "${AGENT_HITL:-true}"
      # 平台级内置技能目录(镜像内 /app/skills 含 browser-operate 等)
      AGENT_GLOBAL_SKILLS: /app/skills
      # create_skill 工具回写后端技能库(内部接口 + 共享令牌)
      BACKEND_INTERNAL_URL: "http://app:8080"
      # --- agent-service 内部回调令牌(create_skill 回写技能库;两服务必须一致且为随机值) ---
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set to a random secret in .env, shared with app}
      # 执行沙箱:execute/文件/浏览器全部在 per-user AIO 沙箱容器内(agent-infra/sandbox);
      # AIO 自带 Chromium+VNC+code-server,前端直接 iframe 嵌入实时画面。
      AGENT_SANDBOX_BACKEND: "${AGENT_SANDBOX_BACKEND:-aio}"
      AGENT_SANDBOX_IMAGE: "${AGENT_SANDBOX_IMAGE:-aio-sandbox:latest}"
      AGENT_SANDBOX_NETWORK: "${AGENT_SANDBOX_NETWORK:-true}"
      AGENT_SANDBOX_NETWORK_NAME: "${AGENT_SANDBOX_NETWORK_NAME:-aiwb-agents}"
      # daemon 视角的 workspace 卷数据根(卷名 = <compose项目名>_workspace)
      AGENT_SANDBOX_VOLUME_ROOT: "${AGENT_SANDBOX_VOLUME_ROOT:-/var/lib/docker/volumes/docker_workspace/_data/users}"
      # AIO 容器内工作区归 gem(uid 1000)
      AGENT_SANDBOX_UID: "${AGENT_SANDBOX_UID:-1000}"
      # 浏览器 + VNC + VSCode 需要更多内存/CPU
      AGENT_SANDBOX_MEM_MB: "${AGENT_SANDBOX_MEM_MB:-4096}"
      AGENT_SANDBOX_CPUS: "${AGENT_SANDBOX_CPUS:-2.0}"
      AGENT_SANDBOX_PIDS: "${AGENT_SANDBOX_PIDS:-512}"
      AGENT_SANDBOX_IDLE_TTL: "${AGENT_SANDBOX_IDLE_TTL:-1800}"
      AGENT_SANDBOX_MAX_TIMEOUT: "${AGENT_SANDBOX_MAX_TIMEOUT:-120}"
    volumes:
      - user-data:/data/users
      # 与 app 共用 workspace 卷:agent 写 /shared-ws/users/<uid>/project
      # == app 前端文件树 /workspace/users/<uid>/project,保证 UI 可见。
      - workspace:/shared-ws
      # 沙箱容器生命周期管理(per-user 容器由 agent-service 创建)
      - /var/run/docker.sock:/var/run/docker.sock
    # 运行期加固:agent-service 需 root(对用户工作区 chown 到沙箱 uid)并访问 docker.sock
    # (创建/回收沙箱容器);no-new-privileges 防止提权放大,降低被攻破后的影响半径。
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - agents
    logging: *default-logging
    restart: unless-stopped

  # deepagents 持久化:线程 checkpoint + 跨线程 store
  postgres:
    image: docker.m.daocloud.io/postgres:16-alpine
    environment:
      POSTGRES_USER: aiworkbench
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aiworkbench-pass}"
      POSTGRES_DB: agent_workbench
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkbench -d agent_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  # 容器化 MySQL 已停用:本机使用宿主机 MySQL80(127.0.0.1:3306,库 ai_workbench,数据保留),
  # app 经 host.docker.internal 访问(见 .env 的 MYSQL_HOST)。如需回到容器 MySQL,
  # 注意 mysql:8.4 默认不加载 mysql_native_password,需加 command: --mysql-native-password=ON。
  # mysql:
  #   image: docker.m.daocloud.io/mysql:8.4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
  #     MYSQL_DATABASE: ai_workbench
  #     MYSQL_USER: aiworkbench
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 30s
  #   logging: *default-logging
  #   restart: unless-stopped

volumes:
  workspace:
  app-data:
  mysql-data:
  user-data:
  postgres-data:

networks:
  # 网关与每用户浏览器容器共用网络(网关按容器名 DNS 直连 CDP/MCP)
  agents:
    name: aiwb-agents
