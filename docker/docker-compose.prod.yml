# ============================================================================
# 生产/云服务器部署专用 compose(用已 load 的镜像,不再 build)
# 用法:拷本文件到云服务器,改下面的密钥,然后 docker compose -f docker-compose.prod.yml up -d
# 前提:已 docker load 导入 docker-app:latest 和 mysql:8.0 两个镜像
# ============================================================================
services:
  app:
    image: docker-app:latest          # 已 docker load 导入的 app 镜像
    image_pull_policy: never          # 禁止拉取,只用本地镜像(离线/内网友好)
    ports:
      - "8080:80"                     # 宿主机 8080 -> 容器 80。改左侧可换端口,如 "80:80"
    environment:
      # --- opencode 内部认证(网关 -> opencode),改密码 ---
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: change-to-a-strong-password
      OPENCODE_BASE_URL: http://127.0.0.1:4096
      # --- JWT:生产务必改成随机长字符串 ---
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_TTL_MINUTES: "1440"
      # --- 注册开关:首个用户自动成为 admin;建议首启 true,建好 admin 后改 false ---
      APP_REGISTRATION_ENABLED: "true"
      # --- AES 加密密钥(Base64 编码 32 字节);生成:openssl rand -base64 32 ---
      # 注意:首次部署生成一次即可,之后不可改(否则已加密的 apiKey 无法解密)
      APP_AES_KEY: "YzTsMr1bI1E9FkED5Bxr6qODnYdOlVHKneYrJV15+oA="
      # --- MySQL ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: aiworkbench
      SPRING_DATASOURCE_PASSWORD: aiworkbench-pass
      # --- 工作区 ---
      OPENWORK_WORKSPACE: /workspace
    volumes:
      - workspace:/workspace
      - app-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0                  # 已 docker load 导入的 mysql 镜像
    image_pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: root-pass          # 生产建议改强密码(并同步下面 healthcheck)
      MYSQL_DATABASE: ai_workbench
      MYSQL_USER: aiworkbench
      MYSQL_PASSWORD: aiworkbench-pass        # 与上方 SPRING_DATASOURCE_PASSWORD 一致
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  workspace:
  app-data:
  mysql-data:
