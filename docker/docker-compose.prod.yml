# ============================================================================
# 生产/云服务器部署专用 compose(用已 load 的镜像,不再 build)
# 用法:拷本文件到云服务器,先配置同目录 .env(参考仓库 docker/.env),然后
#       docker compose -f docker-compose.prod.yml up -d
# 前提:已 docker load 导入 ai-workbench-app 镜像;MySQL 使用宿主机/外部服务,
#      通过 MYSQL_HOST 指定地址,不再使用容器 MySQL。
# ============================================================================
services:
  app:
    image: ai-workbench-app:latest    # 已 docker load 导入的 app 镜像
    image_pull_policy: never          # 禁止拉取,只用本地镜像(离线/内网友好)
    ports:
      - "${APP_PORT:-8080}:80"        # 宿主机端口 -> 容器 80。可用 APP_PORT 覆盖
    environment:
      # --- JWT / AES:生产务必在 .env 设随机密钥 ---
      JWT_SECRET: "${JWT_SECRET:?set in .env}"
      JWT_TTL_MINUTES: "1440"
      APP_REGISTRATION_ENABLED: "${APP_REGISTRATION_ENABLED:-false}"
      APP_AES_KEY: "${APP_AES_KEY:?set in .env}"
      # --- MySQL(本机/外部服务,非容器) ---
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST:?set in .env}:3306/ai_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true"
      SPRING_DATASOURCE_USERNAME: aiworkbench
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?set in .env}"
    volumes:
      - workspace:/workspace
      - app-data:/data
      # 网关经宿主机 docker 守护进程创建/回收每用户 agent 容器
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - agents
    restart: unless-stopped

volumes:
  workspace:
  app-data:

networks:
  agents:
    name: aiwb-agents
