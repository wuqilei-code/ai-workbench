[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

# 以下三段是 supervisorctl 控制通道所必需:
# - [unix_http_server] 创建 unix socket,supervisorctl 通过它下发 RPC 指令
# - [rpcinterface:supervisor] 声明 RPC 工厂
# - [supervisorctl] 指定客户端连接的 socket url
# 缺失这三段会导致 `supervisorctl restart opencode`(旧版 apply 配置时调用)报错:
#   ".ini file does not include supervisorctl section"
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Phase 2 起 opencode 不再常驻:[program:opencode] 已删除,改由网关 OpencodeProcessManager
# 为每个活跃用户按需 setpriv 拉起独立进程(127.0.0.1:141XX,uid 隔离)。仅保留 gateway + nginx。
# 回滚:恢复上方 [program:opencode] 段(见 git 历史)即可回到旧的 root opencode 模式。
[program:gateway]
command=java -Duser.timezone=Asia/Shanghai -jar /app/app.jar
directory=/app
environment=HOME="/root",SPRING_PROFILES_ACTIVE="prod",TZ="Asia/Shanghai"
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
