[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

# 以下三段是 supervisorctl 控制通道所必需:
# - [unix_http_server] 创建 unix socket,supervisorctl 通过它下发 RPC 指令
# - [rpcinterface:supervisor] 声明 RPC 工厂
# - [supervisorctl] 指定客户端连接的 socket url
# 缺失这三段会导致 `supervisorctl restart opencode`(旧版 apply 配置时调用)报错:
#   ".ini file does not include supervisorctl section"
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# 本镜像只跑 gateway(Spring Boot)+ nginx;deepagents 执行在独立 agent-service(compose 内)。
# 回滚:若要恢复旧 root opencode 常驻模式,补 [program:opencode] 段即可(见 git 历史)。
[program:gateway]
command=java -Duser.timezone=Asia/Shanghai -jar /app/app.jar
directory=/app
environment=HOME="/root",SPRING_PROFILES_ACTIVE="prod",TZ="Asia/Shanghai"
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
