# 沙箱画面/服务反代:按 aio_uid cookie 路由到对应用户的 aio-sandbox-u<uid>:8080,
# 使 VNC / code-server / 终端 都走本服务的同一端口(单端口对外),
# 且这些应用使用的根绝对路径(如 /code-server/...)在同一 origin 下天然成立。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS:用于按变量解析 aio-sandbox-u<uid> 容器名(容器重建后 10s 内刷新)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 沙箱反代的鉴权子请求:内部转发到后端校验 aiwb_token,通过后从 X-Aio-Uid 取当前用户。
    location = /__aio_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/api/agent/browser/aio-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 沙箱反代:必须放在静态资源正则之前,避免 /vnc/app/*.js 等被静态规则截走 ---
    # 先经 auth_request 校验 JWT(401 直接拒绝),再从响应头拿 uid 选择上游沙箱;
    # uid 来自服务端校验结果,客户端无法通过 cookie 伪造访问他人沙箱。
    location ~ ^/(vnc|novnc|websockify|code-server|terminal|v1|cdp|json|absproxy|proxy|static/sandbox)(/|$) {
        auth_request /__aio_auth;
        auth_request_set $aio_uid $upstream_http_x_aio_uid;
        # 注意:不要把 upstream 用 set 预计算(rewrite 阶段早于 auth 子请求,会拿到空 uid),
        # 必须内联到 proxy_pass 在 content 阶段求值。
        proxy_pass http://aio-sandbox-u$aio_uid:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }

    # index.html 禁止缓存:确保浏览器每次拿到最新版本(引用最新 hash 的 JS/CSS),
    # 避免部署新前端后用户仍加载旧 index.html 与旧 JS(如 deriveTitle 未生效)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # JS/CSS/图片静态资源也禁止缓存:内网部署优先保证「改完刷新即最新」
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # API + SSE 反代到 Java 网关。SSE 必须关闭缓冲。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # WebSocket 反代:浏览器实时帧率
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # OpenAPI 文档(springdoc)反代到 Java 网关(须在 SPA fallback 之前,否则被 index.html 截走)
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
