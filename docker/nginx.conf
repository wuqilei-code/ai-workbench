server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 禁止缓存:确保浏览器每次拿到最新版本(引用最新 hash 的 JS/CSS),
    # 避免部署新前端后用户仍加载旧 index.html → 旧 JS(如 deriveTitle 未生效)。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # JS/CSS/图片静态资源也禁止缓存:内网部署优先保证「改完刷新即最新」,
    # 即使浏览器/代理复用旧 index.html,也会重新拉取资源而非命中旧缓存。
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # API + SSE 反代到 Java 网关。SSE 必须关闭缓冲。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # WebSocket 反代:浏览器实时帧流
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
