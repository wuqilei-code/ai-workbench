server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: ai-workbench
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 单文件最大 200MB(与 nginx client_max_body_size 对齐;request-size 略大以容纳 form 其他字段)
      max-file-size: 200MB
      max-request-size: 210MB
  # 数据库迁移:现状由 schema.sql 建成,这里用 Flyway 打基线 V1;后续结构变更写入 db/migration/Vn__*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-schema

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# OpenAPI 文档(springdoc):/v3/api-docs、/swagger-ui/index.html
# 生产如需收敛为"需登录",设 OPENAPI_ENABLED=false 并从 SecurityConfig 白名单移除。
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

# 用户工作区 / uid 隔离(deepagents 单轨)
workspace:
  root: ${WORKSPACE_ROOT:/workspace}
  per-user-data-root: ${WORKSPACE_PER_USER_DATA_ROOT:/data/users}
  uid-base: ${WORKSPACE_UID_BASE:100000}

# deepagents agent-service(base-url 供 AgentStreamBridge / JobAgentExecutor)
deepagents:
  base-url: ${DEEPAGENTS_BASE_URL:http://localhost:8000}

# 定时任务队列(JobScheduler/JobQueueDispatcher;执行由 agent-service SSE 承担)
agent-jobs:
  max-concurrent: ${AGENT_JOBS_MAX_CONCURRENT:1}
  timeout-minutes: ${AGENT_JOBS_TIMEOUT_MINUTES:30}
  sweep-ms: ${AGENT_JOBS_SWEEP_MS:5000}

# JWT:生产必须在环境注入随机密钥;缺失会因 JwtTokenProvider 的 >=32 字节校验启动失败(failfast)
jwt:
  secret: ${JWT_SECRET:}
  ttl-minutes: ${JWT_TTL_MINUTES:1440}

# 应用
app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
  # agent-service 内部调用令牌(create_skill 工具回写技能库);compose 两容器注入同一值。
  # 生产必须在环境注入随机值;缺失时 agent-service 对内部接口会 401,防默认令牌滥用。
  internal-token: ${INTERNAL_TOKEN:}
  # 内部接口 /api/internal/** 的额外来源限制:逗号分隔的 IPv4/CIDR(如 172.18.0.0/16,127.0.0.1)。
  # 空 = 不限制来源(仅校验 X-Internal-Token)。生产建议填内网网段。
  internal-trusted-cidrs: ${INTERNAL_TRUSTED_CIDRS:}
  crypto:
    # AES-256 密钥,Base64 编码的 32 字节;留空时用内置 dev key(仅开发,生产必须注入)
    aes-key: ${APP_AES_KEY:}
  rate-limit:
    # 令牌桶:每用户/IP 在 refill-period-seconds 内 refill-tokens 个令牌,桶容量 capacity
    capacity: 200
    refill-tokens: 120
    refill-period-seconds: 60
  # 每用户每日 token 配额(0=不限)。超限时发送消息返回 429。
  quota:
    daily-tokens: ${APP_QUOTA_DAILY_TOKENS:0}
  # 会话 SSE 跨副本广播(基于 session_event 出站表 + seq 增量轮询)
  sse-relay:
    enabled: ${SSE_RELAY_ENABLED:true}
    poll-ms: ${SSE_RELAY_POLL_MS:500}
    retention-seconds: ${SSE_RELAY_RETENTION_SECONDS:300}
    # 实例 id:默认启动时生成随机值;多副本可显式配置(如取容器 hostname)便于排障
    instance-id: ${SSE_RELAY_INSTANCE_ID:}

logging:
  level:
    com.aiworkbench: INFO
    org.springframework.security: INFO