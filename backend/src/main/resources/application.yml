server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: ai-workbench
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 单文件最大 200MB(与 nginx client_max_body_size 对齐;request-size 略大以容纳 form 其他字段)
      max-file-size: 200MB
      max-request-size: 210MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 用户工作区 / uid 隔离(deepagents 单轨)
workspace:
  root: ${WORKSPACE_ROOT:/workspace}
  per-user-data-root: ${WORKSPACE_PER_USER_DATA_ROOT:/data/users}
  uid-base: ${WORKSPACE_UID_BASE:100000}

# deepagents agent-service(base-url 供 AgentStreamBridge / JobAgentExecutor)
deepagents:
  base-url: ${DEEPAGENTS_BASE_URL:http://localhost:8000}

# 定时任务队列(JobScheduler/JobQueueDispatcher;执行由 agent-service SSE 承担)
agent-jobs:
  max-concurrent: ${AGENT_JOBS_MAX_CONCURRENT:1}
  timeout-minutes: ${AGENT_JOBS_TIMEOUT_MINUTES:30}
  sweep-ms: ${AGENT_JOBS_SWEEP_MS:5000}

# JWT
jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-32-chars-long}
  ttl-minutes: ${JWT_TTL_MINUTES:1440}

# 应用
app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
  # agent-service 内部调用令牌(create_skill 工具回写技能库);compose 两容器注入同一值
  internal-token: ${INTERNAL_TOKEN:aiwb-internal-dev}
  crypto:
    # AES-256 密钥,Base64 编码的 32 字节;留空时用内置 dev key(仅开发,生产必须注入)
    aes-key: ${APP_AES_KEY:}
  rate-limit:
    # 令牌桶:每用户/IP 在 refill-period-seconds 内 refill-tokens 个令牌,桶容量 capacity
    capacity: 200
    refill-tokens: 120
    refill-period-seconds: 60

logging:
  level:
    com.aiworkbench: INFO
    org.springframework.security: INFO