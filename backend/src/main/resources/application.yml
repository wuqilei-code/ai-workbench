server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: ai-workbench
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 单文件最大 200MB(与 nginx client_max_body_size 对齐;request-size 略大以容纳 form 其他字段)
      max-file-size: 200MB
      max-request-size: 210MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# opencode 集成
opencode:
  username: ${OPENCODE_SERVER_USERNAME:opencode}
  password: ${OPENCODE_SERVER_PASSWORD:changeme}
  workspace-root: ${OPENWORK_WORKSPACE:/workspace}
  # Phase 1 per-user uid 隔离
  uid-base: ${OPENCODE_UID_BASE:100000}
  port-min: ${OPENCODE_PORT_MIN:14100}
  port-max: ${OPENCODE_PORT_MAX:14399}
  idle-timeout-seconds: ${OPENCODE_IDLE_TIMEOUT:900}
  per-user-data-root: ${OPENCODE_PER_USER_DATA_ROOT:/data/users}
  template-dir: ${OPENCODE_TEMPLATE_DIR:/data/opencode/template}
  # Phase 3 每用户 Docker 容器隔离(容器模式)
  container-mode: ${OPENCODE_CONTAINER_MODE:false}
  agent-image: ${AGENT_IMAGE:ai-workbench-app}
  agent-cpus: ${OPENCODE_AGENT_CPUS:1}
  agent-memory-mb: ${OPENCODE_AGENT_MEMORY_MB:1024}
  agent-stop-grace-seconds: ${OPENCODE_AGENT_STOP_GRACE:5}
  agent-network: ${OPENCODE_AGENT_NETWORK:aiwb-agents}
  # bash 工具默认超时(ms);看门狗 stuck-tool-timeout-ms 须大于它,保证超时后 agent 能继续而非被看门狗 abort
  bash-timeout-ms: ${OPENCODE_BASH_TIMEOUT_MS:300000}
  stuck-tool-timeout-ms: ${OPENCODE_STUCK_TOOL_TIMEOUT_MS:360000}
  # 定时任务队列(JobScheduler/JobQueueDispatcher)
  job-max-concurrent: ${OPENCODE_JOB_MAX_CONCURRENT:1}
  job-image: ${AGENT_IMAGE:ai-workbench-agent}
  job-cpus: ${OPENCODE_JOB_CPUS:1}
  job-memory-mb: ${OPENCODE_JOB_MEMORY_MB:1024}
  job-timeout-minutes: ${OPENCODE_JOB_TIMEOUT_MINUTES:30}
  job-sweep-ms: ${OPENCODE_JOB_SWEEP_MS:5000}

# JWT
jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-32-chars-long}
  ttl-minutes: ${JWT_TTL_MINUTES:1440}

# 应用
app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
  crypto:
    # AES-256 密钥,Base64 编码的 32 字节;留空时用内置 dev key(仅开发,生产必须注入)
    aes-key: ${APP_AES_KEY:}
  rate-limit:
    # 令牌桶:每用户/IP 在 refill-period-seconds 内 refill-tokens 个令牌,桶容量 capacity
    capacity: 200
    refill-tokens: 120
    refill-period-seconds: 60

logging:
  level:
    com.aiworkbench: INFO
    org.springframework.security: INFO
