apiVersion: v1
kind: Pod
metadata:
  name: hostpath-probe
  namespace: ai-workbench
spec:
  nodeName: aiwb-control-plane
  restartPolicy: Never
  containers:
    - name: probe
      image: kind-registry:5000/aiwb-tools:alpine3.19
      command: ["sh", "-c", "echo kind-probe-{$(date +%s%N)} > /mnt/w/users/.hostpath-probe && cat /mnt/w/users/.hostpath-probe && sleep 120"]
      volumeMounts:
        - name: w
          mountPath: /mnt/w
  volumes:
    - name: w
      hostPath:
        path: /mnt/compose-workspace