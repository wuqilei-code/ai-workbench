# Postgres 持久化(deepagents checkpoint + store):StatefulSet + headless 服务
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-workbench
  labels:
    app: ai-workbench
    tier: postgres
spec:
  selector:
    app: ai-workbench
    tier: postgres
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-workbench
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: ai-workbench
      tier: postgres
  template:
    metadata:
      labels:
        app: ai-workbench
        tier: postgres
    spec:
      containers:
        - name: postgres
          image: docker.m.daocloud.io/postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: aiworkbench
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: agent_workbench
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U aiworkbench -d agent_workbench"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U aiworkbench -d agent_workbench"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi