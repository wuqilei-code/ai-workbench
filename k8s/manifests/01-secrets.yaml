# 敏感配置:部署前必须用 kubectl 创建(内容为占位符,禁止提交真实密钥)
# 生成方式见 k8s/README.md。
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-workbench
type: Opaque
stringData:
  # JWT 签名密钥(>=32 字节)
  jwt-secret: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES"
  # AES-256 密钥(Base64 编码 32 字节)
  aes-key: "CHANGE_ME_BASE64_32_BYTES_AES_KEY"
  # app ↔ agent-service 内部回调令牌(两方可不同,随机即可)
  internal-token: "CHANGE_ME_INTERNAL_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: ai-workbench
type: Opaque
stringData:
  # MySQL
  mysql-root-password: "CHANGE_ME_MYSQL_ROOT_PASSWORD"
  mysql-password: "CHANGE_ME_MYSQL_PASSWORD"
  # Postgres
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  # agent-service 完整连接串(密码与上面一致)
  pg-dsn: "postgresql://aiworkbench:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/agent_workbench"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: ai-workbench
type: Opaque
stringData:
  # 模型 API Key(可选;自建 OpenRouter/DeepSeek 等)
  model-api-key: ""