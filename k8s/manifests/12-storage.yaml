# 存储:工作区 RWX 卷 + app 数据卷
#
# workspace 卷为 RWX(ReadWriteMany):app(/workspace)与 agent-service(/shared-ws)
# 以及每用户沙箱 Pod(users/<uid>/project 子路径)三方共享 —— 对应 compose 的 workspace 命名卷。
# 生产 storageClass 需支持 RWX + root 可 chown(如 NFS/Longhorn/CephFS;NFS 注意禁 root_squash
# 的客户端选项,否则 agent-service 的 chown 到沙箱 uid 会失败)。
#
# Docker Desktop 本地验证:默认 SC 为 hostpath-provisioner,仅 RWO。
# 单节点集群里多个 Pod 可同时挂同一个 RWO 卷,故本地把 accessModes 调成 RWO 即可跑全栈;
# 生产多节点必须回退 RWX(见上面说明)。
# storageClassName 注释掉 = 用集群默认 SC;有默认 SC 的环境(Docker Desktop/生产)都可直接 apply。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: ai-workbench
spec:
  accessModes: ["ReadWriteOnce"] # 单节点本地验证用 RWO;生产多节点改回 ReadWriteMany + 集群 SC
  # storageClassName: nfs-storage # 生产按集群替换;本地(Docker Desktop)留空用默认 SC
  resources:
    requests:
      storage: 20Gi
---
# app 应用数据(/data,含 audit)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: ai-workbench
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# 每用户 per-user 数据(/data/users,uid home 隔离)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-data
  namespace: ai-workbench
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi