# 命名空间与资源配额(可按规模调整)
apiVersion: v1
kind: Namespace
metadata:
  name: ai-workbench
  labels:
    app.kubernetes.io/part-of: ai-workbench
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-workbench-quota
  namespace: ai-workbench
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-workbench-limitrange
  namespace: ai-workbench
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 1Gi