# MySQL 业务库:StatefulSet(自动签发 PVC)+ 固定 DNS 服务
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ai-workbench
  labels:
    app: ai-workbench
    tier: mysql
spec:
  selector:
    app: ai-workbench
    tier: mysql
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ai-workbench
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: ai-workbench
      tier: mysql
  template:
    metadata:
      labels:
        app: ai-workbench
        tier: mysql
    spec:
      containers:
        - name: mysql
          # 国内可用镜像;离线可替换为 docker.io/mysql:8.4
          image: docker.m.daocloud.io/mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: ai_workbench
            - name: MYSQL_USER
              value: aiworkbench
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: mysql-password
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi