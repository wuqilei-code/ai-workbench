name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有相同 Issue。**安全漏洞请不要在此报告**,见 [SECURITY.md](../SECURITY.md)。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么,以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 尽量提供最小可复现步骤。
      placeholder: |
        1. ...
        2. ...
        3. 观察到 ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 前端 (frontend)
        - 后端网关 (backend)
        - 智能体 (agent-service)
        - 沙箱 / 浏览器 (docker)
        - 部署 / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 分支、tag 或 commit hash
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志、报错或截图(请隐去密钥等敏感信息)。
      render: shell
    validations:
      required: false
